# Site settings
title:          "kkkkk"
description:    "to say a few words"
baseurl:        ""
url:            "https://thisiskaychen.github.io"


# Author
author:         
  name:         Kay Chen
  url:          https://thisiskaychen.github.io
  email:        kayc010804@gmail.com

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

# Disqus (Set to your disqus id)
disqus:         jekyll-tale
